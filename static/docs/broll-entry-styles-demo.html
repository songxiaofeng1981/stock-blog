<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B-roll 进入方式演示</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;margin:0;background:#f6f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:28px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0;position:sticky;top:0;background:rgba(246,247,251,.95);padding:12px 0;z-index:5}.btn{border:1px solid #dbe1ea;background:#fff;border-radius:999px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.active{background:#2563eb;color:#fff}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:18px;box-shadow:0 14px 40px rgba(31,41,55,.08)}.stage{aspect-ratio:16/9;background:#111827;border-radius:16px;position:relative;overflow:hidden}.speaker,.broll,.callout{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:800}.speaker{inset:0;background:linear-gradient(135deg,#dbeafe,#eef2ff);color:#1e3a8a}.speaker:before{content:"主讲人 A";font-size:28px}.broll{background:linear-gradient(135deg,#dcfce7,#ccfbf1);color:#065f46}.broll:before{content:"B-roll";font-size:28px}.cap{position:absolute;left:16px;bottom:16px;background:rgba(17,24,39,.72);color:#fff;padding:7px 10px;border-radius:9px;font-size:13px}.label{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.08em}.section{border-top:1px solid #e5e7eb;margin-top:16px;padding-top:16px}.value{font-size:16px;line-height:1.7;margin-top:5px}.use{display:inline-block;margin-top:8px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:8px 10px;font-size:13px}.cn{color:#2563eb;font-weight:800}.badge{display:inline-block;background:#eef2ff;color:#4f46e5;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:10px}
@keyframes inR{from{transform:translateX(110%)}to{transform:translateX(0)}}@keyframes pop{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:scale(1)}}@keyframes fade{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:scale(1)}}@keyframes mask{from{clip-path:circle(8% at 50% 50%)}to{clip-path:circle(80% at 50% 50%)}}@keyframes zoom{0%,100%{transform:scale(1)}50%{transform:scale(1.6) translate(-8%,-5%)}}@media(max-width:850px){.grid{grid-template-columns:1fr}.toolbar{position:static}}
</style></head><body><div class="wrap"><div style="font-size:12px;font-weight:800;color:#2563eb;letter-spacing:.12em">REMOTION B-ROLL PRESETS</div><h1>B-roll 进入方式演示</h1><div style="color:#6b7280">点按钮看动作、表达和适用场景。</div><div class="toolbar" id="bar"></div><div class="grid"><div class="card"><div class="badge" id="badge"></div><div class="stage" id="stage"></div></div><div class="card"><h2 id="title"></h2><div class="cn" id="cn"></div><div class="section"><div class="label">动作</div><div class="value" id="action"></div></div><div class="section"><div class="label">表达</div><div class="value" id="meaning"></div></div><div class="section"><div class="label">适合用法</div><div class="use" id="usage"></div></div></div></div></div><script>
const modes=[
['fullscreen','Fullscreen','B-roll 全屏','B-roll 淡入并轻微缩放，完全覆盖主讲画面。','把注意力彻底交给素材本身。','产品、花、工厂、实拍场景'],
['split50','Split 50','主讲 1/2 + B-roll 1/2','主画面缩到左侧 50%，B-roll 从右侧滑入。','两边信息同等重要。','对比、同步讲解'],
['split33','Split 33','主讲 2/3 + B-roll 1/3','主画面缩到约 67%，B-roll 从右侧滑入，占 33%。','主讲仍是主体，B-roll 做辅助。','财经口播、产品补充、图表'],
['pip','PiP','B-roll 小窗悬浮','主画面不动，B-roll 以缩放 + 淡入的小窗进入角落。','不打断主讲，只补充画面。','辅助素材、引用画面'],
['speakerpip','Speaker PiP','B-roll 全屏 + 主讲人小窗','B-roll 铺满，同时主讲人缩成右下角小窗。','素材成为主角，但保留讲述者存在感。','YouTube 解说、产品展示'],
['push','Push','B-roll 推入并挤开主画面','B-roll 从右侧推入，主画面同步被压缩。','比普通 overlay 更有节奏。','重点转折、新章节'],
['floating','Floating Card','B-roll 悬浮卡片','圆角卡片从下方/侧面浮入，带缩放和阴影。','像 UI 组件一样出现，现代感强。','财报、网页、股票图、产品图'],
['mask','Mask Reveal','遮罩揭示','B-roll 从圆形/圆角矩形遮罩中逐渐展开。','强调“揭开 / 展示”的感觉。','产品亮相、新主题'],
['blur','Background Blur','模糊背景适配','同一素材放大铺满做模糊背景，前景保持原比例。','解决竖屏或异比例素材的横屏适配。','手机竖拍、非16:9素材'],
['freeze','Freeze + Callout','定格 + 标注','B-roll 定格，画面压暗，再出现圈选、箭头和文字。','把“看画面”升级成“解释画面”。','财报重点、产品细节、图表'],
['zoom','Zoom Focus','局部放大','完整画面平滑放大到目标区域，再缩回。','主动把视线引向关键细节。','数字、股票图、产品细节'],
['montage','Montage','多镜头拼贴','多个 Scene 同时进入网格，并逐个放大强调。','短时间快速展示一组素材。','片头、总结、多个场景概览']
];
const bar=document.getElementById('bar'),stage=document.getElementById('stage');
function speaker(){let e=document.createElement('div');e.className='speaker';return e}function br(){let e=document.createElement('div');e.className='broll';return e}function cap(t){let e=document.createElement('div');e.className='cap';e.textContent=t;stage.appendChild(e)}
function draw(k){stage.innerHTML='';if(k==='fullscreen'){stage.appendChild(speaker());let b=br();b.style.inset='0';b.style.animation='fade 1s ease both';stage.appendChild(b);cap('B-roll 全屏')}else if(k==='split50'||k==='split33'){let r=k==='split50'?50:67;let s=speaker();s.style.width=r+'%';s.style.right='auto';stage.appendChild(s);let b=br();b.style.left=r+'%';b.style.right='0';b.style.top='0';b.style.bottom='0';b.style.animation='inR .9s ease both';stage.appendChild(b);cap(k==='split50'?'50 / 50':'67 / 33')}else if(k==='pip'){stage.appendChild(speaker());let b=br();b.style.width='30%';b.style.height='34%';b.style.right='4%';b.style.bottom='7%';b.style.borderRadius='18px';b.style.animation='pop .8s ease both';stage.appendChild(b);cap('PiP 小窗')}else if(k==='speakerpip'){let b=br();b.style.inset='0';stage.appendChild(b);let s=speaker();s.style.width='24%';s.style.height='30%';s.style.left='auto';s.style.top='auto';s.style.right='4%';s.style.bottom='6%';s.style.borderRadius='18px';s.style.overflow='hidden';s.style.animation='pop .8s ease both';stage.appendChild(s);cap('B-roll 主导 + Speaker PiP')}else if(k==='push'){let s=speaker();s.style.width='65%';s.style.right='auto';stage.appendChild(s);let b=br();b.style.left='65%';b.style.right='0';b.style.top='0';b.style.bottom='0';b.style.animation='inR .9s ease both';stage.appendChild(b);cap('Push')}else if(k==='floating'){stage.appendChild(speaker());let b=br();b.style.width='38%';b.style.height='48%';b.style.right='5%';b.style.top='24%';b.style.borderRadius='24px';b.style.boxShadow='0 20px 50px rgba(0,0,0,.2)';b.style.animation='pop .8s ease both';stage.appendChild(b);cap('Floating Card')}else if(k==='mask'){stage.appendChild(speaker());let b=br();b.style.inset='0';b.style.animation='mask 1.3s ease both';stage.appendChild(b);cap('Mask Reveal')}else if(k==='blur'){let bg=br();bg.style.inset='0';bg.style.filter='blur(24px) brightness(.75)';bg.style.transform='scale(1.12)';stage.appendChild(bg);let fg=br();fg.style.width='34%';fg.style.height='82%';fg.style.left='33%';fg.style.top='9%';fg.style.borderRadius='16px';stage.appendChild(fg);cap('Background Blur')}else if(k==='freeze'){let b=br();b.style.inset='0';stage.appendChild(b);let c=document.createElement('div');c.className='callout';c.style.width='180px';c.style.height='64px';c.style.right='12%';c.style.top='20%';c.style.border='3px solid #ef4444';c.style.borderRadius='16px';c.style.background='rgba(254,226,226,.92)';c.style.color='#991b1b';c.textContent='重点区域';stage.appendChild(c);cap('Freeze + Callout')}else if(k==='zoom'){let b=br();b.style.inset='0';b.style.animation='zoom 3s ease-in-out infinite';stage.appendChild(b);cap('Zoom Focus')}else if(k==='montage'){[['0','0','50%','50%'],['50%','0','50%','50%'],['0','50%','100%','50%']].forEach((p,i)=>{let e=document.createElement('div');e.style.cssText=`position:absolute;left:${p[0]};top:${p[1]};width:${p[2]};height:${p[3]};display:flex;align-items:center;justify-content:center;font-weight:800;background:${i===1?'#dbeafe':'#dcfce7'}`;e.textContent='Scene 0'+(i+1);stage.appendChild(e)});cap('Multi-scene Montage')}}
function select(i,b){document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');let m=modes[i];badge.textContent=m[1];title.textContent=m[1];cn.textContent=m[2];action.textContent=m[3];meaning.textContent=m[4];usage.textContent=m[5];draw(m[0])}
modes.forEach((m,i)=>{let b=document.createElement('button');b.className='btn'+(i===2?' active':'');b.textContent=m[1];b.onclick=()=>select(i,b);bar.appendChild(b)});select(2,bar.children[2]);
</script></body></html>
