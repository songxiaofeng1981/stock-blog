<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tom Nash｜市场崩盘视频海报简版</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#eee9dc;color:#111}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;display:flex;justify-content:center}
  .poster{
    width:1080px; min-height:1440px; padding:56px 58px 54px;
    background:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,.7), transparent 28%),
      linear-gradient(180deg,#f5f1e7 0%,#eee9dc 100%);
    position:relative; overflow:hidden;
  }
  .topline,.bottomline{display:flex;align-items:center;gap:16px;color:#2a2927}
  .line{height:1.5px;background:#2c2b29;flex:1;opacity:.8}
  .star{font-size:30px;line-height:1}
  .meta{text-align:right;font-family:Georgia,"Times New Roman",serif;font-size:25px;letter-spacing:2px;margin:22px 0 62px}
  .kicker{font-size:34px;font-weight:800;letter-spacing:4px;margin-bottom:8px}
  .headline{font-family:Georgia,"Times New Roman","Songti SC","STSong",serif;font-weight:900;font-size:116px;line-height:.98;letter-spacing:-4px;margin:0 0 14px}
  .underline{width:500px;height:14px;background:#83515d;margin:18px 0 38px}
  .sub{font-family:Georgia,"Times New Roman","Songti SC","STSong",serif;font-size:76px;font-weight:900;line-height:1.05;margin:0 0 28px}
  .maroon{background:#7f4353;color:#f8f1e8;padding:22px 28px 25px;font-size:53px;font-family:Georgia,"Times New Roman","Songti SC","STSong",serif;font-weight:900;line-height:1.15;margin:26px 0 40px}
  .points{margin-top:28px;border-top:2px solid #242321;padding-top:28px;display:grid;gap:22px}
  .point{display:grid;grid-template-columns:74px 1fr;gap:18px;align-items:start}
  .num{font-family:Georgia,"Times New Roman",serif;font-size:54px;font-weight:700;color:#7f4353;line-height:1}
  .ptxt{font-size:34px;line-height:1.34;font-weight:750}
  .ptxt span{font-weight:500}
  .quote{margin:42px 0 46px;border-left:10px solid #7f4353;padding-left:24px;font-size:40px;line-height:1.35;font-family:Georgia,"Times New Roman","Songti SC","STSong",serif;font-weight:800}
  .footer{font-family:Georgia,"Times New Roman","Songti SC","STSong",serif;text-align:center;font-size:24px;letter-spacing:10px;margin-top:26px;color:#3b3935}
  .brand{position:absolute;right:58px;bottom:58px;font-size:18px;letter-spacing:2px;opacity:.55}
  @media(max-width:1080px){.poster{width:100vw;min-height:133.33vw;transform-origin:top left}}
</style>
</head>
<body>
<main class="poster">
  <div class="topline"><div class="line"></div><div class="star">✦</div><div class="line"></div></div>
  <div class="meta">Tom Nash · 2026 / 09 / 30</div>

  <div class="kicker">市场真正的问题不是“会不会崩”</div>
  <div class="headline">而是你<br>有没有准备</div>
  <div class="underline"></div>

  <div class="sub">别预测崩盘<br>把崩盘写进系统</div>

  <div class="maroon">长期在场 · 下跌加码 · 上涨放慢</div>

  <div class="points">
    <div class="point">
      <div class="num">01</div>
      <div class="ptxt">先活下来：<span>留应急现金、去高息债、少杠杆，先保证不会在暴跌时被迫卖出。</span></div>
    </div>
    <div class="point">
      <div class="num">02</div>
      <div class="ptxt">只买值得越跌越买的资产：<span>核心仓用大盘指数，个股数量别太多，先看生意质量再看价格。</span></div>
    </div>
    <div class="point">
      <div class="num">03</div>
      <div class="ptxt">靠规则，不靠情绪：<span>定投、回撤加仓、24 小时冷静期，提前把自己的投资规则写下来。</span></div>
    </div>
  </div>

  <div class="quote">“真正的大钱，不是在牛市最热的时候赚的，而是在恐慌时敢继续买。”</div>

  <div class="bottomline"><div class="line"></div><div class="star">✦</div><div class="line"></div></div>
  <div class="footer">市场会波动　系统要稳定</div>
  <div class="brand">VIDEO NOTE</div>
</main>
</body>
</html>
